  /v2/notes/{id}:
    $ref: './paths/notes.yml#/noteByEntityId'
  /v2/preferences:
    $ref: './paths/preferences.yml#/preferences'
  /v2/account-groups:
    $ref: './paths/account-groups.yml#/accountGroups'
  /v2/account-groups/{id}:
    $ref: './paths/account-groups.yml#/accountGroupById'
  /v2/budgets/months:
