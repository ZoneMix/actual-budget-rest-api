payees:
  get:
    summary: List payees
    tags: [Payees]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Payees list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                payees:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Payee'
            examples:
              sample:
                value:
                  success: true
                  payees:
                    - id: p-1
                      name: Kroger
                    - id: p-2
                      name: "Transfer: Checking"
                      transfer_acct: acct-1
  post:
    summary: Create payee
    tags: [Payees]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [payee]
            properties:
              payee:
                type: object
                required: [name]
                description: >-
                  A payee has only a name. `transfer_acct` is set by the engine
                  when it creates the hidden payee behind a transfer; it is not
                  accepted here and a value sent for it is rejected.
                properties:
                  name:
                    type: string
                    maxLength: 255
    responses:
      201:
        description: Payee created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                id:
                  type: string
            examples:
              created:
                value:
                  success: true
                  id: p-abc

payeeById:
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  put:
    summary: Update payee
    tags: [Payees]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [fields]
            properties:
              fields:
                type: object
                minProperties: 1
                description: >-
                  At least one field must be present; an empty object is a 400.
                  Only the name is writable — see the create endpoint on
                  `transfer_acct`.
                properties:
                  name:
                    type: string
                    maxLength: 255
    responses:
      200:
        description: Payee updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
  delete:
    summary: Delete payee
    tags: [Payees]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Payee deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'

payeesMerge:
  post:
    summary: Merge payees
    tags: [Payees]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [targetId, mergeIds]
            properties:
              targetId:
                type: string
                format: uuid
                description: The payee that survives the merge.
              mergeIds:
                type: array
                minItems: 1
                description: Payees folded into the target and then removed.
                items:
                  type: string
                  format: uuid
    responses:
      200:
        description: Payees merged
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true

payeesCommon:
  get:
    summary: List common payees
    description: >-
      The payees Actual ranks as frequently used — a strict subset of
      GET /v2/payees, ordered by the engine.
    tags: [Payees]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Common payees list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                payees:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Payee'
            examples:
              sample:
                value:
                  success: true
                  payees:
                    - id: 4d5e6f70-8888-4091-a2b3-c4d5e6f70819
                      name: Hy-Vee
                    - id: 5e6f7081-9999-41a2-b3c4-d5e6f7081920
                      name: Casey's
