health:
  get:
    summary: Health check
    description: |
      Returns comprehensive health status including:
      - Application status (ok/degraded)
      - Database connectivity
      - Actual API connectivity
      - System resources (development only)
      
      **Information Disclosure Prevention:**
      - Production: Only shows service status, no system details
      - Development: Shows full system information (memory, uptime, node version, platform)

      **This endpoint observes the engine, it never drives it.** It takes the
      engine only once initialisation has finished — a poll can never trigger
      `init()` or a budget download — and it never syncs, so a recorded
      `lastSyncError` survives being polled. Its two engine calls run through
      the ordinary queue under the shorter `ACTUAL_HEALTH_TIMEOUT_MS`
      (default 5000), so a queue held by a long export cannot hang the probe.

      `checks.actualApi.status` therefore has four values: `ok`,
      `not-initialised` (startup has not finished), `busy` (the engine did not
      answer inside the health budget, or the queue is at its depth cap) and
      `error` (the engine refused the call).

      Returns 200 for healthy, 503 for degraded status. Any
      `checks.actualApi.status` other than `ok` is degraded.
    tags: [Health]
    operationId: getHealth
    responses:
      '200':
        description: API is healthy
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, degraded]
                  example: ok
                timestamp:
                  type: string
                  format: date-time
                  example: '2024-12-19T18:00:00.000Z'
                checks:
                  type: object
                  properties:
                    database:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [ok, error]
                          example: ok
                        message:
                          type: string
                          example: 'Database connection healthy'
                        error:
                          type: string
                          description: Error details (development only)
                    actualApi:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [ok, not-initialised, busy, error]
                          example: ok
                        message:
                          type: string
                          example: 'Actual API connection healthy'
                        queueDepth:
                          type: integer
                          description: Engine operations currently queued or running
                          example: 0
                        lastSyncAt:
                          type: integer
                          nullable: true
                          description: Epoch milliseconds of the last successful sync, null if none yet
                          example: 1766000000000
                        lastSyncError:
                          type: object
                          nullable: true
                          description: |
                            Last sync failure, null while syncs are succeeding.
                            In production only `at` is returned — the raw message can
                            carry Actual server connection details and this endpoint
                            is unauthenticated.
                          properties:
                            message:
                              type: string
                              description: Error details (development only)
                              example: 'Failed to sync with Actual Budget server'
                            at:
                              type: string
                              format: date-time
                        serverVersion:
                          type: string
                          nullable: true
                          description: |
                            Version of the Actual server the engine syncs with.
                            DEVELOPMENT ONLY — omitted in production, because this
                            endpoint is unauthenticated and an upstream version
                            string is CVE-matching input. Use the authenticated
                            GET /v2/server/version instead.
                            Best-effort even in development: null when the server
                            is unreachable or the version call fails, since a
                            health check must not 500 over a nice-to-have field.
                          example: '25.9.0'
                        error:
                          type: string
                          description: Error details (development only)
                    system:
                      type: object
                      description: System information (development only)
                      properties:
                        memory:
                          type: object
                          properties:
                            rss:
                              type: string
                              example: '150MB'
                            heapTotal:
                              type: string
                              example: '50MB'
                            heapUsed:
                              type: string
                              example: '30MB'
                            external:
                              type: string
                              example: '5MB'
                        uptime:
                          type: string
                          example: '3600s'
                        nodeVersion:
                          type: string
                          example: 'v24.12.0'
                        platform:
                          type: string
                          example: 'darwin'
      '503':
        description: Service is degraded (one or more checks failed)
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [degraded]
                  example: degraded
                timestamp:
                  type: string
                  format: date-time
                checks:
                  type: object
                  description: Health check results
