schedules:
  get:
    summary: List schedules
    tags: [Schedules]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Schedules list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                schedules:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Schedule'
            examples:
              sample:
                value:
                  success: true
                  schedules:
                    - id: sch-1
                      name: Rent
                      amount: -120000
                      amountOp: is
                      next_date: '2026-10-01'
                      posts_transaction: true
                      completed: false
                      date:
                        start: '2026-01-01'
                        frequency: monthly
                        interval: 1
                    - id: sch-2
                      name: Annual insurance
                      amount: -84000
                      amountOp: is
                      next_date: '2026-11-15'
                      posts_transaction: false
                      completed: false
                      date: '2026-11-15'
  post:
    summary: Create schedule
    description: >-
      `date` is either a single calendar date or a recurrence object — there is
      no separate `recur` or `frequency` field; the recurrence lives inside
      `date`. `amount` is a number of minor units, or a `{ num1, num2 }` range
      when `amountOp` is `isbetween`.
    tags: [Schedules]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [schedule]
            properties:
              schedule:
                type: object
                required: [date]
                properties:
                  name:
                    type: string
                    maxLength: 255
                  date:
                    $ref: '../components/schemas.yml#/ScheduleDate'
                  _date:
                    deprecated: true
                    description: >-
                      Deprecated alias for `date`; removed in 3.0.0. Renamed to
                      `date` before validation, and ignored when `date` is also
                      present.
                    allOf:
                      - $ref: '../components/schemas.yml#/ScheduleDate'
                  amount:
                    $ref: '../components/schemas.yml#/ScheduleAmount'
                  amountOp:
                    type: string
                    enum: [is, isapprox, isbetween]
                    default: is
                    description: >-
                      How `amount` is matched. Defaults to `is` when omitted, so
                      a created schedule always has one.
                  account:
                    type: string
                    description: Account id the schedule posts to.
                  payee:
                    type: string
                    description: Payee id.
                  posts_transaction:
                    type: boolean
                    description: >-
                      Whether the engine posts the transaction automatically on
                      the due date instead of only proposing it.
          examples:
            monthlyRent:
              summary: A recurring schedule
              value:
                schedule:
                  name: Rent
                  amount: -120000
                  amountOp: is
                  account: 11111111-1111-4111-8111-111111111111
                  payee: 22222222-2222-4222-8222-222222222222
                  posts_transaction: true
                  date:
                    start: '2026-10-01'
                    frequency: monthly
                    interval: 1
                    skipWeekend: false
            oneOff:
              summary: A single-date schedule
              value:
                schedule:
                  name: Annual insurance
                  amount: -84000
                  date: '2026-11-15'
    responses:
      201:
        description: Schedule created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                id:
                  type: string
            examples:
              created:
                value:
                  success: true
                  id: sch-xyz

scheduleById:
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  put:
    summary: Update schedule
    tags: [Schedules]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: resetNextDate
        required: false
        description: >-
          Recompute the schedule's next occurrence from the updated date.
          Omit it to leave the engine's own default in place.
        schema:
          type: boolean
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [fields]
            properties:
              fields:
                type: object
                minProperties: 1
                description: >-
                  At least one field must be present; an empty object is a 400.
                  Unlike create, `amountOp` has no default here — omitting it
                  leaves the stored value alone.
                properties:
                  name:
                    type: string
                    maxLength: 255
                  date:
                    $ref: '../components/schemas.yml#/ScheduleDate'
                  _date:
                    deprecated: true
                    description: Deprecated alias for `date`; removed in 3.0.0.
                    allOf:
                      - $ref: '../components/schemas.yml#/ScheduleDate'
                  amount:
                    $ref: '../components/schemas.yml#/ScheduleAmount'
                  amountOp:
                    type: string
                    enum: [is, isapprox, isbetween]
                  account:
                    type: string
                  payee:
                    type: string
                  posts_transaction:
                    type: boolean
    responses:
      200:
        description: Schedule updated
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                schedule:
                  $ref: '../components/schemas.yml#/Schedule'
            examples:
              updated:
                value:
                  success: true
                  schedule:
                    id: sch-xyz
                    name: Rent (updated)
                    amount: -125000
                    amountOp: is
                    next_date: '2026-11-01'
                    date:
                      start: '2026-01-01'
                      frequency: monthly
                      interval: 1
  delete:
    summary: Delete schedule
    tags: [Schedules]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Schedule deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
