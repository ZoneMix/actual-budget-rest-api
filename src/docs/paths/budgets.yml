budgetMonths:
  get:
    summary: List budget months
    tags: [Budgets]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Budget months
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                months:
                  type: array
                  items:
                    type: string

budgetByMonth:
  parameters:
    - in: path
      name: month
      required: true
      schema:
        type: string
        pattern: '^\\d{4}-\\d{2}$'
  get:
    summary: Get budget month
    tags: [Budgets]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Budget month data
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                budget:
                  type: object

budgetCategoryBudget:
  post:
    summary: Set budgeted amount
    tags: [Budgets]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: month
        required: true
        schema:
          type: string
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount:
                type: integer
    responses:
      200:
        description: Amount set
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true

budgetCategoryCarryover:
  post:
    summary: Set carryover flag
    tags: [Budgets]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: month
        required: true
        schema:
          type: string
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [flag]
            properties:
              flag:
                type: boolean
    responses:
      200:
        description: Carryover updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'

budgetHold:
  post:
    summary: Hold amount from next month
    tags: [Budgets]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: month
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [amount]
            properties:
              amount:
                type: integer
    responses:
      200:
        description: Hold set
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true

budgetResetHold:
  post:
    summary: Reset held amount
    tags: [Budgets]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: month
        required: true
        schema:
          type: string
    responses:
      200:
        description: Hold reset
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true

budgetBatch:
  post:
    summary: Apply many budget edits at once
    description: >-
      Applies every operation under ONE engine transaction, strictly in the
      order given. Cheaper and safer than issuing the edits one request at a
      time: no other request can interleave a sync between them.
    tags: [Budgets]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [operations]
            properties:
              operations:
                type: array
                minItems: 1
                maxItems: 500
                items:
                  $ref: '../components/schemas.yml#/BatchBudgetOperation'
          examples:
            mixed:
              value:
                operations:
                  - type: setAmount
                    month: 2026-09
                    categoryId: 11111111-aaaa-4111-8111-111111111111
                    amount: 125000
                  - type: setCarryover
                    month: 2026-09
                    categoryId: 11111111-aaaa-4111-8111-111111111111
                    flag: true
    responses:
      200:
        description: Operations applied
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                applied:
                  type: integer
                  description: How many operations were applied.
            examples:
              ok:
                value:
                  success: true
                  applied: 2
