accountTransactions:
  parameters:
    - in: path
      name: accountId
      required: true
      schema:
        type: string
  get:
    summary: List account transactions
    tags: [Transactions]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: start
        schema:
          type: string
          format: date
      - in: query
        name: end
        schema:
          type: string
          format: date
    responses:
      200:
        description: Transactions list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                accountId:
                  type: string
                transactions:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Transaction'
            examples:
              sample:
                value:
                  success: true
                  accountId: acct-123
                  transactions:
                    - id: tx-1
                      amount: -4599
                      payee: Kroger
                      date: 2025-12-01
                      category: cat-groceries
                    - id: tx-2
                      amount: 250000
                      payee: Employer
                      date: 2025-12-15
                      category: cat-income
  post:
    summary: Add transactions
    tags: [Transactions]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [transactions]
            properties:
              transactions:
                type: array
                minItems: 1
                items:
                  $ref: '../components/schemas.yml#/NewTransaction'
              runTransfers:
                type: boolean
                default: false
                description: Resolve transfer pairs after adding.
              learnCategories:
                type: boolean
                default: false
                description: Let the engine learn payee-to-category from these rows.
    responses:
      201:
        description: Transactions added
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                accountId:
                  type: string
                result:
                  type: string
                  enum: ['ok']
                  description: >-
                    The engine's acknowledgement. Actual's addTransactions
                    resolves with the literal string "ok" and returns no ids,
                    so no per-transaction id is available here.
                submittedCount:
                  type: integer
                  description: Number of transactions in the request body.
                addedCount:
                  type: integer
                  deprecated: true
                  description: >-
                    Deprecated alias for submittedCount; removed in 3.0.0.
                    Responses carry Deprecation and Warning headers.
            examples:
              simple:
                summary: Create a single transaction
                value:
                  success: true
                  accountId: acct-123
                  result: ok
                  submittedCount: 1
                  addedCount: 1
              multiple:
                summary: Create multiple transactions
                value:
                  success: true
                  accountId: acct-123
                  result: ok
                  submittedCount: 2
                  addedCount: 2

accountTransactionsImport:
  post:
    summary: Import transactions with reconciliation
    tags: [Transactions]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [transactions]
            properties:
              transactions:
                type: array
                minItems: 1
                items:
                  $ref: '../components/schemas.yml#/NewTransaction'
              opts:
                type: object
                description: >-
                  Forwarded verbatim to the engine's importTransactions.
                  Omit it to let the engine apply its own defaults.
                additionalProperties: false
                properties:
                  defaultCleared:
                    type: boolean
                  dryRun:
                    type: boolean
                  reimportDeleted:
                    type: boolean
                  payeeNameNormalization:
                    type: string
                    enum: [original, title-case]
    responses:
      201:
        description: Transactions imported
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                accountId:
                  type: string
                result:
                  type: object
            examples:
              import:
                summary: Import with imported_id
                value:
                  success: true
                  accountId: acct-123
                  result:
                    added: ["tx-1"]
                    updated: []
                    errors: []
              mixed:
                summary: Import with updates
                value:
                  success: true
                  accountId: acct-123
                  result:
                    added: ["tx-3"]
                    updated: ["tx-2"]
                    errors: []

transactionById:
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  put:
    summary: Update transaction by ID
    tags: [Transactions]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [fields]
            properties:
              fields:
                type: object
                minProperties: 1
                description: >-
                  At least one field must be present; an empty object is a 400.
                  Every field of a new transaction is writable except the
                  account, which a transaction cannot be moved between.
                properties:
                  amount:
                    type: integer
                  date:
                    type: string
                    format: date
                  payee:
                    type: string
                  payee_name:
                    type: string
                  imported_payee:
                    type: string
                  imported_id:
                    type: string
                  notes:
                    type: string
                    maxLength: 1000
                  category:
                    type: string
                    nullable: true
                  cleared:
                    type: boolean
                  reconciled:
                    type: boolean
                  transfer_id:
                    type: string
                    nullable: true
                  starting_balance_flag:
                    type: boolean
                  subtransactions:
                    type: array
                    items:
                      type: object
                      required: [amount]
                      properties:
                        amount:
                          type: integer
                        category:
                          type: string
                          nullable: true
                        notes:
                          type: string
                        payee:
                          type: string
    responses:
      200:
        description: Transaction updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
  delete:
    summary: Delete transaction by ID
    tags: [Transactions]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Transaction deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
