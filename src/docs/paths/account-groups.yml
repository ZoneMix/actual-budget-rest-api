accountGroups:
  get:
    summary: List account groups
    tags: [Account Groups]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Account groups list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                accountGroups:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/AccountGroup'
            examples:
              sample:
                value:
                  success: true
                  accountGroups:
                    - id: 5c4d3e2f-3333-4b5c-8d6e-7f8091a2b3c4
                      name: Everyday
                    - id: b1c2d3e4-4444-4c5d-8e6f-708192a3b4c5
                      name: Long-term savings
  post:
    summary: Create account group
    description: >-
      Accounts join a group through their account_group_id field; creating a
      group does not move any account into it.
    tags: [Account Groups]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [group]
            properties:
              group:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                    maxLength: 255
          examples:
            create:
              value:
                group:
                  name: Everyday
    responses:
      201:
        description: Account group created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                id:
                  type: string
            examples:
              created:
                value:
                  success: true
                  id: 5c4d3e2f-3333-4b5c-8d6e-7f8091a2b3c4

accountGroupById:
  parameters:
    - in: path
      name: id
      required: true
      description: Account group id
      schema:
        type: string
  put:
    summary: Update account group
    tags: [Account Groups]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      description: At least one field must be present.
      content:
        application/json:
          schema:
            type: object
            required: [fields]
            properties:
              fields:
                type: object
                minProperties: 1
                properties:
                  name:
                    type: string
          examples:
            rename:
              value:
                fields:
                  name: Long-term savings
    responses:
      200:
        description: Account group updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
  delete:
    summary: Delete account group
    description: Deletes the group only; the accounts it held are left ungrouped.
    tags: [Account Groups]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Account group deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
