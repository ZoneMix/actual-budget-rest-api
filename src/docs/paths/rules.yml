rules:
  get:
    summary: List rules
    tags: [Rules]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Rules list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                rules:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Rule'
            examples:
              sample:
                value:
                  success: true
                  rules:
                    - id: r-1
                      stage: default
                      conditionsOp: and
                      conditions:
                        - field: payee
                          op: is
                          value: 11111111-1111-4111-8111-111111111111
                          type: id
                      actions:
                        - op: set
                          field: category
                          value: 22222222-2222-4222-8222-222222222222
                          type: id
                    - id: r-2
                      stage: pre
                      conditionsOp: and
                      conditions:
                        - field: notes
                          op: contains
                          value: Fuel
                      actions:
                        - op: append-notes
                          value: " (gas)"
  post:
    summary: Create rule
    description: >-
      The body carries no `id` — the engine assigns one and returns the stored
      rule. `stage` defaults to `default` when omitted.
    tags: [Rules]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [rule]
            properties:
              rule:
                type: object
                required: [conditions, actions]
                properties:
                  stage:
                    type: string
                    enum: [pre, default, post]
                    default: default
                  conditionsOp:
                    type: string
                    enum: [and, or]
                  conditions:
                    type: array
                    minItems: 1
                    items:
                      $ref: '../components/schemas.yml#/RuleCondition'
                  actions:
                    type: array
                    minItems: 1
                    items:
                      $ref: '../components/schemas.yml#/RuleAction'
          examples:
            categorise:
              summary: Categorise every Kroger transaction
              value:
                rule:
                  stage: default
                  conditionsOp: and
                  conditions:
                    - field: payee
                      op: is
                      value: 11111111-1111-4111-8111-111111111111
                      type: id
                  actions:
                    - op: set
                      field: category
                      value: 22222222-2222-4222-8222-222222222222
                      type: id
    responses:
      201:
        description: Rule created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                rule:
                  $ref: '../components/schemas.yml#/Rule'
            examples:
              created:
                value:
                  success: true
                  rule:
                    id: r-abc
                    stage: default
                    conditionsOp: and
                    conditions:
                      - field: amount
                        op: gt
                        value: 10000
                        type: number
                    actions:
                      - op: set
                        field: category
                        value: 22222222-2222-4222-8222-222222222222
                        type: id

rulesByPayee:
  get:
    summary: List rules for payee
    tags: [Rules]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: payeeId
        required: true
        schema:
          type: string
    responses:
      200:
        description: Payee rules list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                payeeId:
                  type: string
                rules:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Rule'

ruleById:
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  put:
    summary: Update rule
    description: >-
      Partial update. Actual's engine replaces the whole rule, so the wrapper
      reads the current rule first and merges these fields onto it; an unknown
      id is a 404 and nothing is written.
    tags: [Rules]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [fields]
            properties:
              fields:
                type: object
                minProperties: 1
                description: >-
                  At least one field must be present; an empty object is a 400.
                  `stage` has no default here — omitting it leaves the stored
                  stage alone rather than resetting it to `default`.
                properties:
                  stage:
                    type: string
                    enum: [pre, default, post]
                  conditionsOp:
                    type: string
                    enum: [and, or]
                  conditions:
                    type: array
                    minItems: 1
                    items:
                      $ref: '../components/schemas.yml#/RuleCondition'
                  actions:
                    type: array
                    minItems: 1
                    items:
                      $ref: '../components/schemas.yml#/RuleAction'
    responses:
      200:
        description: Rule updated
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                rule:
                  $ref: '../components/schemas.yml#/Rule'
            examples:
              updated:
                value:
                  success: true
                  rule:
                    id: r-abc
                    stage: default
                    conditionsOp: and
                    conditions:
                      - field: notes
                        op: contains
                        value: "Fuel"
                    actions:
                      - op: set
                        field: category
                        value: 33333333-3333-4333-8333-333333333333
                        type: id
      404:
        description: No rule with that id
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Error'
            examples:
              missing:
                value:
                  error: Rule r-abc not found
                  code: NOT_FOUND
  delete:
    summary: Delete rule
    tags: [Rules]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Rule deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
