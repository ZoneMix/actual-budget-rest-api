accounts:
  get:
    summary: List accounts
    tags: [Accounts]
    security:
      - bearerAuth: []
    responses:
      200:
        description: List of accounts
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                accounts:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Account'
            examples:
              sample:
                summary: Two accounts
                value:
                  success: true
                  accounts:
                    - id: acct-1
                      name: Checking
                      type: checking
                      offbudget: false
                      closed: false
                    - id: acct-2
                      name: Savings
                      type: savings
                      offbudget: true
                      closed: false
  post:
    summary: Create account
    description: >-
      Actual's create call ignores account_group_id, so when one is supplied the
      wrapper applies it with a follow-up update in the same operation. The
      account is therefore created first and grouped a moment later.
    tags: [Accounts]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateAccountRequest'
    responses:
      201:
        description: Account created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                id:
                  type: string
            examples:
              created:
                value:
                  success: true
                  id: acct-123

accountById:
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
  put:
    summary: Update account
    tags: [Accounts]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/UpdateAccountRequest'
    responses:
      200:
        description: Account updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
  delete:
    summary: Delete account
    tags: [Accounts]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Account deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'

accountClose:
  post:
    summary: Close account
    tags: [Accounts]
    security:
      - bearerAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CloseAccountRequest'
    responses:
      200:
        description: Account closed
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'

accountReopen:
  post:
    summary: Reopen account
    tags: [Accounts]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Account reopened
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'

accountBalance:
  get:
    summary: Get account balance
    tags: [Accounts]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: cutoff
        schema:
          type: string
        description: >-
          Calculate the balance as of this point in time. Either a calendar
          date (YYYY-MM-DD) or a full ISO 8601 timestamp. A value that is not a
          real date is rejected with 400.
        examples:
          date:
            value: '2026-03-01'
          timestamp:
            value: '2026-03-01T12:30:00.000Z'
    responses:
      200:
        description: Account balance
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Balance'
            examples:
              balance:
                value:
                  success: true
                  balance: 12030

accountBankSync:
  parameters:
    - in: path
      name: accountId
      required: true
      description: Account to sync. Must be a UUID.
      schema:
        type: string
        format: uuid
  post:
    summary: Pull new transactions from the linked bank
    description: >-
      Runs a bank sync (GoCardless/SimpleFIN) for this one account. A write:
      it creates transactions.


      **An account with no bank link is a 200, not an error.** The engine
      treats "not linked" as a sync that produced zero errors, so the response
      is indistinguishable from a real sync that found nothing new. There is no
      way to tell the two apart from this endpoint; check that the account has
      a bank link in Actual before relying on it.
    tags: [Accounts]
    security:
      - bearerAuth: []
    responses:
      200:
        description: >-
          Bank sync completed — or the account has no bank link and nothing
          happened. Both look like this.
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                accountId:
                  type: string
            examples:
              ok:
                value:
                  success: true
                  accountId: 11111111-1111-4111-8111-111111111111
