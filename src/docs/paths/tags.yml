tags:
  get:
    summary: List tags
    tags: [Tags]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Tags list
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                tags:
                  type: array
                  items:
                    $ref: '../components/schemas.yml#/Tag'
            examples:
              sample:
                value:
                  success: true
                  tags:
                    - id: 3f2c1b9a-1111-4a2b-8c3d-4e5f60718293
                      tag: vacation
                      color: "#ff7043"
                      description: Trips and travel
                    - id: 8d7e6f50-2222-4b3c-9d4e-5f6071829304
                      tag: reimbursable
                      color: "#42a5f5"
                      description: null
  post:
    summary: Create tag
    tags: [Tags]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tag]
            properties:
              tag:
                type: object
                required: [tag]
                properties:
                  tag:
                    type: string
                    maxLength: 255
                  color:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
          examples:
            create:
              value:
                tag:
                  tag: vacation
                  color: "#ff7043"
                  description: Trips and travel
    responses:
      201:
        description: Tag created
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                id:
                  type: string
            examples:
              created:
                value:
                  success: true
                  id: 3f2c1b9a-1111-4a2b-8c3d-4e5f60718293

tagById:
  parameters:
    - in: path
      name: id
      required: true
      description: Tag id
      schema:
        type: string
  put:
    summary: Update tag
    tags: [Tags]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      description: At least one field must be present.
      content:
        application/json:
          schema:
            type: object
            required: [fields]
            properties:
              fields:
                type: object
                minProperties: 1
                properties:
                  tag:
                    type: string
                  color:
                    type: string
                    nullable: true
                  description:
                    type: string
                    nullable: true
          examples:
            recolour:
              value:
                fields:
                  color: "#66bb6a"
    responses:
      200:
        description: Tag updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
  delete:
    summary: Delete tag
    tags: [Tags]
    security:
      - bearerAuth: []
    responses:
      200:
        description: Tag deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Success'
            examples:
              ok:
                value:
                  success: true
