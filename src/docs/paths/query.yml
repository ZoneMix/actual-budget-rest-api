query:
  post:
    summary: Execute ActualQL query
    description: |
      Execute ActualQL queries against Actual Budget data.
      
      The JSON body is mapped onto Actual's own query builder in a fixed order:
      table, then each filter, then select or calculate, then groupBy, orderBy,
      options, limit and offset.

      **Security Restrictions:**
      - Only read-only tables are allowed (transactions, accounts, categories, etc.)
      - Filter depth is limited to ACTUAL_QUERY_MAX_FILTER_DEPTH levels (default 5)
      - Result size is limited to ACTUAL_QUERY_MAX_RESULTS records (default 10,000)
      - select, orderBy, groupBy and calculate field names are rejected if they
        contain a path-traversal sequence
      - select and calculate cannot be combined
      - Query structure is validated for security
      - All queries are audit logged
      
      **Required scope:** `read`. This is a read over POST — the whitelist above
      makes a mutation impossible — so a read-only token may call it, unlike
      every other POST endpoint.

      **Rate Limited:** 20 requests per minute
      
      See [ActualQL documentation](https://actualbudget.org/docs/api/actual-ql/) for query syntax.
    tags: [Query]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [query]
            properties:
              query:
                type: object
                description: ActualQL query object
                required: [table]
                properties:
                  table:
                    type: string
                    enum:
                      - transactions
                      - accounts
                      - categories
                      - category_groups
                      - payees
                      - schedules
                      - rules
                      - budgets
                      - budget_months
                    description: Table to query (whitelist enforced)
                    example: transactions
                  filter:
                    description: >-
                      One filter expression, or an array of up to 50 of them
                      applied in order. Array entries are siblings, not nesting,
                      and may not themselves be arrays. Nesting via $and/$or is
                      capped by ACTUAL_QUERY_MAX_FILTER_DEPTH.
                    oneOf:
                      - type: object
                      - type: array
                        items:
                          type: object
                    example:
                      date:
                        $gte: '2024-01-01'
                  select:
                    description: >-
                      Defaults to "*" when omitted. Cannot be combined with
                      calculate.
                    oneOf:
                      - type: string
                        enum: ['*']
                        description: Select all fields
                      - type: array
                        items:
                          type: string
                        description: Select specific fields
                    example: ['id', 'amount', 'date']
                  calculate:
                    description: >-
                      An aggregate expression such as { "$sum": "amount" }.
                      Cannot be combined with select; the response data is then
                      the scalar result rather than a row array.
                    oneOf:
                      - type: string
                      - type: object
                    example:
                      $sum: amount
                  groupBy:
                    description: At most 100 fields.
                    oneOf:
                      - type: string
                      - type: array
                        maxItems: 100
                        items:
                          type: string
                    example: ['category']
                  orderBy:
                    description: At most 100 fields.
                    oneOf:
                      - type: string
                      - type: array
                        maxItems: 100
                        items:
                          oneOf:
                            - type: string
                            - type: object
                    example:
                      - date: desc
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 10000
                    description: Ceiling is ACTUAL_QUERY_MAX_RESULTS (default 10000).
                  offset:
                    type: integer
                    minimum: 0
                    description: >-
                      Rows to skip. SQL requires a LIMIT alongside an OFFSET, so
                      an offset sent without a limit is given
                      ACTUAL_QUERY_MAX_RESULTS as its limit.
                  options:
                    type: object
                    description: Table options passed straight to the builder
                    additionalProperties: false
                    properties:
                      splits:
                        type: string
                        enum: [inline, grouped, all]
    responses:
      '200':
        description: Query executed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  description: >-
                    Query results, capped at ACTUAL_QUERY_MAX_RESULTS rows. A
                    calculate query returns the scalar aggregate instead.
                  oneOf:
                    - type: array
                      items:
                        type: object
                    - type: number
                truncated:
                  type: boolean
                  description: True when rows were dropped to meet the cap.
                result:
                  deprecated: true
                  description: Deprecated alias for data; removed in 3.0.0.
                  oneOf:
                    - type: array
                      items:
                        type: object
                    - type: number
            examples:
              rows:
                value:
                  success: true
                  data:
                    - id: tx-1
                      amount: -4599
                  truncated: false
                  result:
                    - id: tx-1
                      amount: -4599
      '400':
        description: Invalid query (validation failed)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Error'
      '403':
        description: Query rejected (security restriction)
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Error'
      '429':
        description: Rate limit exceeded
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Error'
